# Same-cluster stand-in for the Milo importer role: read the inventory kinds
# the controller lists, and write the ones it imports by server-side apply,
# which needs create for a record's first apply and patch for later ones.
# No update, delete or status access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: netbox-provider-standalone-importer, namespace: netbox-inventory}
rules:
  - apiGroups: [fleet.datumapis.com]
    resources: [facilities]
    verbs: [get, list]
  - apiGroups: [fleet.datumapis.com]
    resources: [racks, powerfeeds, deviceclaims, devices, cables]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: netbox-provider-standalone-importer, namespace: netbox-inventory}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: netbox-provider-standalone-importer}
subjects:
  - {kind: ServiceAccount, name: netbox-provider-manager, namespace: netbox-provider-system}
