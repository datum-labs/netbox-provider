# The manager reads its own configuration kinds and their token Secrets only
# in netbox-provider-system (--namespace). Secrets are listed and watched as
# metadata only, so a rotated token is picked up at once; the token itself is
# read with get and never cached. Fleet inventory is not local RBAC: it is Milo
# IAM through the Fleet kubeconfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netbox-provider-manager-sources
  namespace: netbox-provider-system
rules:
  - apiGroups: [netbox.miloapis.com]
    resources: [netboxsources, netboxmappings]
    verbs: [get, list, watch]
  - apiGroups: [netbox.miloapis.com]
    resources: [netboxsources/status]
    verbs: [get, update, patch]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
