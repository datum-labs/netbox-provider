apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-provider-manager
  namespace: netbox-provider-system
  labels:
    app.kubernetes.io/name: netbox-provider-manager
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-provider-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-provider-manager
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: netbox-provider-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/datum-labs/netbox-provider:latest
          imagePullPolicy: IfNotPresent
          command: [/netbox-provider]
          # NetBoxSources are read only in this namespace; Fleet inventory is
          # read and created through the mounted Milo kubeconfig named in the
          # environment-owned config. See config/README.md.
          args:
            - operator
            - --config=/etc/netbox-provider/manager/config.yaml
            - --namespace=netbox-provider-system
            - --leader-election-namespace=netbox-provider-system
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/netbox-provider/manager
              readOnly: true
            - name: fleet-kubeconfig
              mountPath: /var/run/netbox-provider/fleet
              readOnly: true
      # Both inputs are environment-owned and absent from this bundle.
      volumes:
        - name: config
          configMap:
            name: netbox-provider-manager-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: fleet-kubeconfig
          secret:
            secretName: netbox-provider-fleet-kubeconfig
            defaultMode: 0440
            items:
              - key: value
                path: kubeconfig
