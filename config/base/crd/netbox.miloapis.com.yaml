---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: netboxmappings.netbox.miloapis.com
spec:
  group: netbox.miloapis.com
  names:
    kind: NetBoxMapping
    listKind: NetBoxMappingList
    plural: netboxmappings
    singular: netboxmapping
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.revision
      name: Revision
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetBoxMapping holds reviewed import decisions for a NetBoxSource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetBoxMappingSpec is the reviewed interpretation of a NetBox
              source.
            properties:
              bmc:
                description: |-
                  BMC writes Device.spec.bmc.endpoint as https://<IPv4>:443 from the
                  device's NetBox out-of-band IP, for Devices with a chassis serial whose
                  role is listed. A device without a usable IPv4 out-of-band IP gets no
                  BMC; the Device is still created. Unset writes no BMC.
                properties:
                  roleSlugs:
                    description: |-
                      RoleSlugs are the NetBox device roles whose out-of-band IP is a
                      Redfish BMC, such as servers. Other devices' out-of-band IPs, for
                      example a switch's management address, are never written as a BMC.
                    items:
                      maxLength: 100
                      minLength: 1
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  vrfIDs:
                    description: |-
                      VRFIDs are NetBox VRFs whose out-of-band IPs may be used. An address in
                      the global table (no VRF) is always usable; an address in any other VRF
                      is never treated as global, and writes no BMC.
                    items:
                      format: int64
                      minimum: 1
                      type: integer
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                required:
                - roleSlugs
                type: object
              cableMedia:
                description: |-
                  CableMedia gives the reviewed medium of data cables by NetBox cable
                  type. Power and console cables take their medium from the components
                  they connect. A data cable whose type has no rule stays unresolved.
                items:
                  description: CableMediumRule gives the medium of data cables of
                    some NetBox cable types.
                  properties:
                    cableTypes:
                      description: CableTypes are NetBox cable type values, such as
                        cat6 or smf.
                      items:
                        maxLength: 64
                        minLength: 1
                        type: string
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    medium:
                      description: Medium is the Fleet medium of those cables.
                      enum:
                      - Copper
                      - Fiber
                      - Unknown
                      type: string
                  required:
                  - cableTypes
                  - medium
                  type: object
                maxItems: 64
                type: array
              devices:
                description: |-
                  Devices holds per-device reviewed decisions. Unlisted devices stay
                  unresolved; nothing is imported by default.
                items:
                  description: DeviceMapping is the reviewed interpretation of one
                    NetBox device.
                  properties:
                    classification:
                      description: Classification is Physical or Excluded.
                      enum:
                      - Physical
                      - Excluded
                      type: string
                    id:
                      description: ID is the NetBox device ID.
                      format: int64
                      minimum: 1
                      type: integer
                    placement:
                      description: Placement is the placement precision to assert.
                      enum:
                      - Facility
                      - RackMembership
                      - RackUnits
                      type: string
                    reason:
                      description: Reason explains an exclusion.
                      maxLength: 256
                      minLength: 1
                      type: string
                    serialMeaning:
                      description: SerialMeaning is the reviewed meaning of the NetBox
                        serial field.
                      enum:
                      - Chassis
                      - ProviderHostID
                      - Unknown
                      type: string
                  required:
                  - classification
                  - id
                  type: object
                  x-kubernetes-validations:
                  - message: excluded devices need a reason; physical devices need
                      serialMeaning and placement
                    rule: 'self.classification == ''Excluded'' ? (has(self.reason)
                      && !has(self.serialMeaning) && !has(self.placement)) : (has(self.serialMeaning)
                      && has(self.placement))'
                maxItems: 4096
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              exclusions:
                description: |-
                  Exclusions exclude whole device roles, for example hosted virtual
                  machines recorded in DCIM.
                items:
                  description: |-
                    RoleExclusion excludes every device whose NetBox role has one of the slugs.
                    Exclusions win over device mappings.
                  properties:
                    reason:
                      description: Reason explains the exclusion.
                      maxLength: 256
                      minLength: 1
                      type: string
                    roleSlugs:
                      description: RoleSlugs are NetBox device role slugs.
                      items:
                        type: string
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - reason
                  - roleSlugs
                  type: object
                maxItems: 64
                type: array
              facilities:
                description: |-
                  Facilities maps NetBox sites and locations to existing Facilities.
                  Unmapped premises stay unresolved.
                items:
                  description: |-
                    FacilityMapping maps one NetBox site or location to an existing Fleet
                    Facility. The controller never creates Facilities: premises identity is
                    operator-owned, and a NetBox site name is not proof of premises.
                  properties:
                    facilityRef:
                      description: FacilityRef names an existing Facility in the target
                        namespace.
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    sourceID:
                      description: SourceID is the NetBox numeric ID of the site or
                        location.
                      format: int64
                      minimum: 1
                      type: integer
                    sourceType:
                      description: SourceType is Site or Location.
                      enum:
                      - Site
                      - Location
                      type: string
                  required:
                  - facilityRef
                  - sourceID
                  - sourceType
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - sourceType
                - sourceID
                x-kubernetes-list-type: map
              revision:
                description: |-
                  Revision identifies the reviewed mapping content. It is written to
                  every created record as the netbox.miloapis.com/mapping-revision
                  annotation. Change it whenever the mapping changes.
                maxLength: 253
                minLength: 1
                type: string
              untypedCableMedium:
                description: |-
                  UntypedCableMedium is the medium of data cables that have no NetBox
                  cable type. When unset, they stay unresolved.
                enum:
                - Copper
                - Fiber
                - Unknown
                type: string
            required:
            - revision
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: netboxsources.netbox.miloapis.com
spec:
  group: netbox.miloapis.com
  names:
    kind: NetBoxSource
    listKind: NetBoxSourceList
    plural: netboxsources
    singular: netboxsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceID
      name: Source
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetBoxSource connects one NetBox instance to one Fleet inventory
          namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetBoxSourceSpec defines one NetBox instance and how it is
              imported.
            properties:
              authScheme:
                default: Bearer
                description: AuthScheme is the Authorization header scheme.
                enum:
                - Bearer
                - Token
                type: string
              interval:
                default: 30m
                description: Interval between complete re-reads of NetBox.
                type: string
                x-kubernetes-validations:
                - message: interval must be between 1m and 24h
                  rule: duration(self) >= duration('1m') && duration(self) <= duration('24h')
              mappingRef:
                description: |-
                  MappingRef names the NetBoxMapping, in the same namespace, that holds
                  the reviewed interpretation of this source's records.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              mode:
                default: Observe
                description: |-
                  Mode is Observe (default, read-only) or Create (additive creation of new
                  records). Switching to Create is the explicit ownership opt-in.
                enum:
                - Observe
                - Create
                type: string
              readLimits:
                description: |-
                  ReadLimits bound each NetBox collection read. Unset fields keep their
                  defaults.
                properties:
                  collectionTimeout:
                    description: |-
                      CollectionTimeout bounds the read of one collection. Each request is
                      also bounded at 30 seconds. Default 2m.
                    type: string
                    x-kubernetes-validations:
                    - message: collectionTimeout must be between 10s and 30m
                      rule: duration(self) >= duration('10s') && duration(self) <=
                        duration('30m')
                  maxMiBPerCollection:
                    description: |-
                      MaxMiBPerCollection bounds the response bytes of one collection, in
                      MiB. Each page is still bounded at 4 MiB. Default 64.
                    format: int32
                    maximum: 4096
                    minimum: 1
                    type: integer
                  maxRecordsPerCollection:
                    description: |-
                      MaxRecordsPerCollection bounds the records in one collection. The page
                      bound scales with it at 200 records per page. Default 20000.
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                type: object
              scope:
                description: Scope narrows what is read from NetBox.
                properties:
                  siteIDs:
                    description: |-
                      SiteIDs restricts racks, locations and devices to these NetBox site IDs.
                      The filter is sent to NetBox and must be preserved by every pagination
                      link.
                    items:
                      format: int64
                      type: integer
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                type: object
              sourceID:
                description: |-
                  SourceID is the stable, operator-assigned identifier of this NetBox
                  instance. It is written as the netbox.miloapis.com/source label on every
                  Fleet record and is part of every generated name, so it is immutable.
                  Keep it when the URL changes; assign a new one after a database restore
                  or fork that can reuse record IDs. It is not a hostname.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: sourceID is immutable
                  rule: self == oldSelf
              suspend:
                description: Suspend stops reading and writing. Existing status is
                  retained.
                type: boolean
              target:
                description: Target is the Fleet namespace and writer.
                properties:
                  namespace:
                    description: |-
                      Namespace in the Fleet (Milo provider project) control plane that holds
                      the inventory records.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                    x-kubernetes-validations:
                    - message: target namespace is immutable; create a new NetBoxSource
                        for a new target
                      rule: self == oldSelf
                  writer:
                    description: Writer is the explicit writer identity for created
                      records.
                    enum:
                    - Operator
                    type: string
                required:
                - namespace
                - writer
                type: object
              tokenSecretRef:
                description: TokenSecretRef names the Secret key holding a read-only
                  NetBox API token.
                properties:
                  key:
                    default: token
                    description: Key within the Secret's data that holds the API token.
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret, in the same namespace as the
                      NetBoxSource.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              url:
                description: |-
                  URL is the HTTPS installation root of NetBox, including any path
                  prefix, but not the /api suffix. It must not contain credentials, a
                  query, or a fragment.
                maxLength: 2048
                minLength: 9
                type: string
                x-kubernetes-validations:
                - message: url must be an https URL without credentials, query or
                    fragment
                  rule: isURL(self) && url(self).getScheme() == 'https' && url(self).getHostname()
                    != '' && !self.contains('@') && !self.contains('?') && !self.contains('#')
            required:
            - mappingRef
            - sourceID
            - target
            - tokenSecretRef
            - url
            type: object
          status:
            description: NetBoxSourceStatus is the observed state of a NetBoxSource.
            properties:
              conditions:
                description: |-
                  Conditions: ConfigurationResolved, SourceObserved, FleetObserved,
                  Applied and Ready. Uncertainty is Unknown, never True.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastObservation:
                description: LastObservation describes the last complete NetBox read.
                properties:
                  counts:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: Counts holds the number of records read per collection.
                    type: object
                  mappingRevision:
                    description: MappingRevision is the NetBoxMapping revision the
                      plan used.
                    type: string
                  observedAt:
                    description: ObservedAt is when the read started.
                    format: date-time
                    type: string
                  snapshotDigest:
                    description: SnapshotDigest is the sha256 of the canonical, field-allowlisted
                      records.
                    type: string
                required:
                - mappingRevision
                - observedAt
                - snapshotDigest
                type: object
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              pendingReleases:
                description: |-
                  PendingReleases lists records another writer created while this
                  controller was applying them, whose fields this controller has not yet
                  released. Each is retried on every Create-mode reconcile, and its target
                  stays quarantined, never adopted, until the release succeeds. While the
                  list is full, nothing is written.
                items:
                  description: |-
                    PendingRelease is a record whose fields this controller still has to
                    release.
                  properties:
                    kind:
                      description: Kind is the Fleet kind.
                      type: string
                    message:
                      description: Message is the last release failure.
                      type: string
                    name:
                      description: Name is the Fleet record name.
                      type: string
                    namespace:
                      description: Namespace is the Fleet namespace.
                      type: string
                    since:
                      description: Since is when the first release failed.
                      format: date-time
                      type: string
                    uid:
                      description: |-
                        UID is the record's UID. A record with another UID is a different
                        record, which this controller never wrote.
                      type: string
                  required:
                  - kind
                  - name
                  - namespace
                  - since
                  - uid
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              plan:
                description: Plan counts outcomes of the last complete plan.
                properties:
                  create:
                    format: int32
                    type: integer
                  created:
                    format: int32
                    type: integer
                  excluded:
                    format: int32
                    type: integer
                  quarantined:
                    format: int32
                    type: integer
                  retainedMissingSource:
                    format: int32
                    type: integer
                  unchanged:
                    format: int32
                    type: integer
                  unresolved:
                    format: int32
                    type: integer
                  unsupported:
                    format: int32
                    type: integer
                  update:
                    format: int32
                    type: integer
                  updated:
                    format: int32
                    type: integer
                required:
                - create
                - created
                - excluded
                - quarantined
                - retainedMissingSource
                - unchanged
                - unresolved
                - unsupported
                - update
                - updated
                type: object
              records:
                description: Records lists notable records, conflicts first. It is
                  bounded.
                items:
                  description: |-
                    RecordStatus reports one notable record. It never carries serials, asset
                    tags, or other source field values.
                  properties:
                    message:
                      description: Message is a short human-readable explanation.
                      type: string
                    reason:
                      description: Reason is a CamelCase machine-readable cause.
                      type: string
                    source:
                      description: Source is the source record key, such as dcim/devices/12.
                      type: string
                    state:
                      description: State is the planned or achieved outcome.
                      enum:
                      - Create
                      - Created
                      - Update
                      - Updated
                      - Unchanged
                      - Quarantined
                      - Unresolved
                      - Excluded
                      - Unsupported
                      - RetainedMissingSource
                      type: string
                    target:
                      description: Target is the Fleet Kind/name, when one was planned.
                      type: string
                  required:
                  - state
                  type: object
                maxItems: 100
                type: array
              recordsTruncated:
                description: RecordsTruncated is true when Records omits entries.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
